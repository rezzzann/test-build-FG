
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokereza — тест 3D ALL-IN</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07100c;
      color: #f3d58b;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 { letter-spacing: 3px; }

    #stage {
      position: relative;
      width: min(90vw, 700px);
      height: min(65vh, 460px);
      min-height: 280px;
      overflow: hidden;
      border: 1px solid #86652a;
      border-radius: 18px;
      background: radial-gradient(ellipse, #174c35, #07140e 75%);
    }

    #stage canvas {
      display: block;
    }

    button {
      margin-top: 22px;
      padding: 14px 28px;
      border: 1px solid #e8bf62;
      border-radius: 8px;
      background: #8a641d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 14px;
      color: #c7d5ca;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>POKEREZA</h1>
  <p>ТЕСТ 3D ALL-IN</p>

  <div id="stage"></div>
  <button id="play">ЗАПУСТИТЬ ALL-IN</button>
  <div id="status">Готов к тесту</div>

  <script type="module">
    import { playAllIn3D } from "./js/3d-animation/allin.js";

    const stage = document.getElementById("stage");
    const status = document.getElementById("status");
    const button = document.getElementById("play");

    let currentEffect = null;

    button.addEventListener("click", () => {
      if (currentEffect) {
        currentEffect.stop();
        currentEffect = null;
      }

      status.textContent = "Запуск 3D-анимации…";

      try {
        currentEffect = playAllIn3D({
          container: stage,
          duration: 3500,
          onComplete: () => {
            currentEffect = null;
            status.textContent = "Анимация завершена";
          }
        });

        if (currentEffect) {
          status.textContent = "3D-анимация запущена";
        } else {
          status.textContent = "WebGL недоступен";
        }
      } catch (error) {
        console.error(error);
        status.textContent = "Ошибка — смотри Console (F12)";
      }
    });
  </script>
</body>
</html>
