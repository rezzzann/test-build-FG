
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pokereza — Golden ALL IN</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050403;
  font-family: Arial, sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 45%, #35200b 0%, #100b05 42%, #030302 100%);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#brand {
  position: fixed;
  top: 22px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #f8d68b;
  font-size: clamp(20px, 4vw, 30px);
  font-weight: 800;
  letter-spacing: .25em;
  text-shadow: 0 0 22px #ffb32e66;
  pointer-events: none;
}

#controls {
  position: fixed;
  bottom: max(25px, env(safe-area-inset-bottom));
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}

button {
  pointer-events: auto;
  padding: 15px 30px;
  border: 1px solid #fff0b1;
  border-radius: 40px;
  background: linear-gradient(135deg, #fff4c8, #dca02f 50%, #fff0a3);
  color: #291704;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: .12em;
  box-shadow: 0 0 30px #e9a62b33;
  cursor: pointer;
}

#status {
  color: #d9bd84;
  font-size: 12px;
  text-shadow: 0 1px 8px #000;
}

#flash {
  position: fixed;
  inset: 0;
  background: #fff1bc;
  opacity: 0;
  pointer-events: none;
}

@media (max-height: 500px) {
  #brand { top: 10px; }
  #controls { bottom: 10px; }
  button { padding: 10px 22px; }
}
</style>
</head>

<body>
<div id="stage"></div>
<div id="brand">POKEREZA</div>
<div id="flash"></div>

<div id="controls">
  <button id="play">ЗАПУСТИТЬ ALL-IN</button>
  <div id="status">Золотой шар готов</div>
</div>

<script type="module">
import * as THREE from "three";

const stage = document.querySelector("#stage");
const button = document.querySelector("#play");
const status = document.querySelector("#status");
const flash = document.querySelector("#flash");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  42, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(0, 0, 7);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
stage.appendChild(renderer.domElement);

// Освещение
scene.add(new THREE.AmbientLight(0xffd99a, 1.2));

const goldLight = new THREE.PointLight(0xffb52e, 110, 30);
goldLight.position.set(0, 1, 3);
scene.add(goldLight);

const rimLight = new THREE.PointLight(0xff6b12, 70, 20);
rimLight.position.set(-3, -1, -2);
scene.add(rimLight);

// Золотой шар
const orb = new THREE.Group();
scene.add(orb);

const bodyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe5a52c,
  metalness: 0.88,
  roughness: 0.2,
  clearcoat: 1,
  clearcoatRoughness: 0.12,
  emissive: 0x9b4a08,
  emissiveIntensity: 0.24
});

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.3, 96, 72),
  bodyMaterial
);
orb.add(sphere);


// Лицевая золотая медаль с надписью
const face = new THREE.Group();
face.position.z = 1.285;
inscription.position.z = 0.035;
orb.add(face);

// Текст на лицевой стороне
const textCanvas = document.createElement("canvas");
textCanvas.width = 1024;
textCanvas.height = 512;

const ctx = textCanvas.getContext("2d");
ctx.clearRect(0, 0, 1024, 512);

ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.font = "900 190px Arial";
ctx.shadowColor = "#fff0a0";
ctx.shadowBlur = 25;
ctx.fillStyle = "#fff1b0";
ctx.fillText("ALL IN", 512, 256);
ctx.shadowBlur = 0;
ctx.lineWidth = 4;
ctx.strokeStyle = "#8e4b08";
ctx.strokeText("ALL IN", 512, 256);

const textTexture = new THREE.CanvasTexture(textCanvas);
textTexture.colorSpace = THREE.SRGBColorSpace;

const inscription = new THREE.Mesh(
  new THREE.PlaneGeometry(1.65, 0.82),
  new THREE.MeshBasicMaterial({
    map: textTexture,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    side: THREE.DoubleSide
  })
);
inscription.position.z = 0.025;
face.add(inscription);

// Внешнее золотое свечение
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(1.48, 48, 40),
  new THREE.MeshBasicMaterial({
    color: 0xffa51d,
    transparent: true,
    opacity: 0.2,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
orb.add(halo);

// Огненные языки вокруг шара
const flameGroup = new THREE.Group();
orb.add(flameGroup);

const flameMaterials = [];
const flameItems = [];

for (let i = 0; i < 55; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 1.22 + Math.random() * 0.22;
  const length = 0.12 + Math.random() * 0.48;

  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(
      Math.cos(angle) * radius,
      Math.sin(angle) * radius,
      (Math.random() - 0.5) * 0.2
    ),
    new THREE.Vector3(
      Math.cos(angle + 0.15) * (radius + length * 0.35),
      Math.sin(angle + 0.15) * (radius + length * 0.35),
      0.05
    ),
    new THREE.Vector3(
      Math.cos(angle + 0.3) * (radius + length),
      Math.sin(angle + 0.3) * (radius + length),
      0
    )
  );

  const material = new THREE.MeshBasicMaterial({
    color: i % 5 === 0 ? 0xfff0b0 : 0xffa51d,
    transparent: true,
    opacity: 0.65,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const flame = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 12, 0.008 + Math.random() * 0.012, 5, false),
    material
  );

  flameGroup.add(flame);
  flameItems.push(flame);
  flameMaterials.push(material);
}

// Мелкие золотые фишки для финального взрыва
const chips = [];
const chipGeometry = new THREE.CylinderGeometry(0.09, 0.09, 0.035, 24);

const chipMaterials = [
  new THREE.MeshStandardMaterial({
    color: 0xffd46a, metalness: 0.85, roughness: 0.22,
    emissive: 0x8c4c08, emissiveIntensity: 0.35
  }),
  new THREE.MeshStandardMaterial({
    color: 0xfff0b5, metalness: 0.9, roughness: 0.18,
    emissive: 0x9a690f, emissiveIntensity: 0.3
  }),
  new THREE.MeshStandardMaterial({
    color: 0xc78319, metalness: 0.9, roughness: 0.25,
    emissive: 0x6d3300, emissiveIntensity: 0.3
  })
];

for (let i = 0; i < 95; i++) {
  const chip = new THREE.Mesh(
    chipGeometry,
    chipMaterials[i % chipMaterials.length]
  );

  chip.visible = false;
  scene.add(chip);

  const direction = new THREE.Vector3(
    Math.random() * 2 - 1,
    Math.random() * 2 - 1,
    Math.random() * 0.8 + 0.3
  ).normalize();

  chips.push({
    mesh: chip,
    direction,
    speed: 1.5 + Math.random() * 4.2,
    spin: (Math.random() - 0.5) * 12,
    delay: Math.random() * 0.22,
    scale: 0.55 + Math.random() * 1.1,
    rotation: new THREE.Vector3(
      Math.random() * 6,
      Math.random() * 6,
      Math.random() * 6
    )
  });
}

// Искры вокруг шара
const SPARK_COUNT = 500;
const sparkPositions = new Float32Array(SPARK_COUNT * 3);
const sparkColors = new Float32Array(SPARK_COUNT * 3);
const sparkData = [];

for (let i = 0; i < SPARK_COUNT; i++) {
  const direction = new THREE.Vector3(
    Math.random() * 2 - 1,
    Math.random() * 2 - 1,
    Math.random() * 2 - 1
  ).normalize();

  sparkData.push({
    direction,
    speed: 0.3 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
    radius: 1.2 + Math.random() * 0.5
  });

  const color = new THREE.Color(
    Math.random() > 0.55 ? 0xffe6a0 : 0xff9a19
  );

  sparkColors[i * 3] = color.r;
  sparkColors[i * 3 + 1] = color.g;
  sparkColors[i * 3 + 2] = color.b;
}

const sparkGeometry = new THREE.BufferGeometry();
sparkGeometry.setAttribute(
  "position", new THREE.BufferAttribute(sparkPositions, 3)
);
sparkGeometry.setAttribute(
  "color", new THREE.BufferAttribute(sparkColors, 3)
);

const sparkMaterial = new THREE.PointsMaterial({
  size: 0.035,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const sparks = new THREE.Points(sparkGeometry, sparkMaterial);
scene.add(sparks);

// Вспышка взрыва
const flashLight = new THREE.PointLight(0xffd36b, 0, 35);
scene.add(flashLight);

let running = false;
let startTime = 0;
let frameId = 0;
let previousTime = 0;

function easeOutBounce(x) {
  const n1 = 7.5625;
  const d1 = 2.75;

  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) {
    x -= 1.5 / d1;
    return n1 * x * x + 0.75;
  }
  if (x < 2.5 / d1) {
    x -= 2.25 / d1;
    return n1 * x * x + 0.9375;
  }

  x -= 2.625 / d1;
  return n1 * x * x + 0.984375;
}

function smooth(a, b, x) {
  const v = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
  return v * v * (3 - 2 * v);
}

function reset() {
  orb.visible = true;
  orb.position.set(0, 3.5, 0);
  orb.scale.setScalar(1);
  orb.rotation.set(0, 0, 0);

  inscription.material.opacity = 0;
  halo.material.opacity = 0.2;
  flameGroup.visible = true;

  sparkMaterial.opacity = 0.85;
  flash.style.opacity = 0;
  flashLight.intensity = 0;

  chips.forEach(c => {
    c.mesh.visible = false;
    c.mesh.position.set(0, 0, 0);
    c.mesh.rotation.set(
      c.rotation.x, c.rotation.y, c.rotation.z
    );
  });

  const p = sparkGeometry.attributes.position.array;
  for (let i = 0; i < SPARK_COUNT; i++) {
    const d = sparkData[i];
    p[i * 3] = d.direction.x * d.radius;
    p[i * 3 + 1] = d.direction.y * d.radius;
    p[i * 3 + 2] = d.direction.z * d.radius;
  }
  sparkGeometry.attributes.position.needsUpdate = true;
}

function animate(now) {
  if (!running) return;

  const t = (now - startTime) / 1000;
  const dt = Math.min((now - previousTime) / 1000, 0.04);
  previousTime = now;

  // 0–1.1 сек: падение и пружинящий отскок
  const fall = smooth(0, 0.85, t);
  const bounceTime = Math.max(0, t - 0.85);
  const bounce = Math.sin(bounceTime * 8) *
                 Math.exp(-bounceTime * 2.5);

  orb.position.y = THREE.MathUtils.lerp(3.5, 0, fall);

  if (t >= 0.85 && t < 1.65) {
    orb.position.y = bounce * 0.32;
  } else if (t >= 1.65) {
    orb.position.y = 0;
  }

  // 1.2–3.1 сек: полный оборот, постепенно замедляющийся
  const spinProgress = smooth(1.2, 3.1, t);
  const spinAngle = 2 * Math.PI * (1 - Math.pow(1 - spinProgress, 2));

  orb.rotation.y = spinAngle;
  orb.rotation.x = Math.sin(t * 1.7) * 0.07 * (1 - spinProgress);
  orb.rotation.z = Math.sin(t * 2.2) * 0.035 * (1 - spinProgress);

  // Мягкое пульсирующее золотое свечение
  const pulse = 1 + Math.sin(t * 4.5) * 0.025;
  const glowPulse = 0.2 + (Math.sin(t * 3.2) + 1) * 0.06;

  halo.material.opacity = glowPulse;
  halo.scale.setScalar(pulse);
  goldLight.intensity = 95 + Math.sin(t * 4) * 20;
  flameGroup.rotation.z = Math.sin(t * 1.5) * 0.04;

  flameItems.forEach((f, i) => {
    f.material.opacity = 0.38 + (Math.sin(t * 5 + i) + 1) * 0.2;
  });

  // Надпись становится яркой, когда шар замедляет вращение
  const textFade = smooth(2.35, 2.9, t);
  inscription.material.opacity = textFade;

  if (t > 2.4 && t < 3.15) {
    status.textContent = "ALL IN";
  }

  // 3.3 сек: яркая вспышка и распад шара на фишки
  const explode = smooth(3.2, 3.38, t);
  const explosionAge = Math.max(0, t - 3.25);

  if (t >= 3.25) {
    orb.visible = false;
    flameGroup.visible = false;

    flash.style.opacity = String(
      Math.max(0, (1 - explosionAge / 0.42) * 0.9)
    );

    flashLight.position.copy(orb.position);
    flashLight.intensity = Math.max(0, 700 * (1 - explosionAge / 0.35));

    chips.forEach(c => {
      if (explosionAge < c.delay) return;

      c.mesh.visible = true;

      const local = explosionAge - c.delay;
      const distance = local * c.speed;

      c.mesh.position.set(
        c.direction.x * distance,
        c.direction.y * distance,
        c.direction.z * distance
      );

      c.mesh.rotation.x += dt * c.spin;
      c.mesh.rotation.y += dt * c.spin * 0.75;
      c.mesh.rotation.z += dt * c.spin * 0.55;

      const scale = c.scale * (1 - smooth(1.4, 2.5, local));
      c.mesh.scale.setScalar(Math.max(0.001, scale));
    });

    sparkMaterial.opacity = Math.max(0, 1 - explosionAge / 1.6);
    status.textContent = "ЗОЛОТОЙ ВЗРЫВ";
  } else {
    // Искры продолжают вращаться вокруг шара
    const p = sparkGeometry.attributes.position.array;

    for (let i = 0; i < SPARK_COUNT; i++) {
      const d = sparkData[i];
      const radius = d.radius + Math.sin(t * 3 + d.phase) * 0.09;

      p[i * 3] = d.direction.x * radius;
      p[i * 3 + 1] = d.direction.y * radius;
      p[i * 3 + 2] = d.direction.z * radius;
    }

    sparkGeometry.attributes.position.needsUpdate = true;
  }

  renderer.render(scene, camera);

  if (t >= 5.7) {
    running = false;
    button.disabled = false;
    status.textContent = "Готово. Можно запустить снова.";
    return;
  }

  frameId = requestAnimationFrame(animate);
}

function launch() {
  if (running) return;

  cancelAnimationFrame(frameId);
  reset();

  running = true;
  button.disabled = true;
  status.textContent = "Золотой шар падает…";

  startTime = performance.now();
  previousTime = startTime;
  frameId = requestAnimationFrame(animate);
}

button.addEventListener("click", launch);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

window.addEventListener("resize", resize);

reset();
renderer.render(scene, camera);
</script>
</body>
</html>
