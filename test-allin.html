
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokereza — ALL-IN 3D Test</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse, #174c35, #06130e 75%);
      color: #f4d27c;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(94vw, 900px);
      text-align: center;
    }

    h1 {
      letter-spacing: 5px;
      font-size: clamp(28px, 5vw, 46px);
    }

    #stage {
      position: relative;
      height: min(55vh, 460px);
      min-height: 280px;
      overflow: hidden;
      border: 1px solid #c99c45;
      border-radius: 18px;
      background: radial-gradient(ellipse, #205a40, #04110b);
      box-shadow: 0 0 40px #0009;
    }

    button {
      margin-top: 22px;
      padding: 15px 30px;
      border: 1px solid #ffe6a0;
      border-radius: 30px;
      background: linear-gradient(135deg, #fff0b7, #bd8123);
      color: #211506;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 14px;
      color: #e1d3af;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <h1>POKEREZA</h1>
    <p>3D ALL-IN — визуальный тест</p>

    <div id="stage"></div>

    <button id="play">ЗАПУСТИТЬ ALL-IN</button>
    <div id="status">Нажми кнопку для запуска</div>
  </main>

  <script type="module">
    import { playAllIn3D } from "./js/3d-animation/allin.js";

    const stage = document.querySelector("#stage");
    const button = document.querySelector("#play");
    const status = document.querySelector("#status");

    button.addEventListener("click", () => {
      button.disabled = true;
      status.textContent = "Анимация запускается…";

      try {
        const result = playAllIn3D({
          container: stage,
          duration: 3500,
          onComplete: () => {
            button.disabled = false;
            status.textContent = "Готово. Можно запустить снова.";
          }
        });

        if (result === null) {
          button.disabled = false;
          status.textContent =
            "WebGL недоступен. Проверь консоль браузера.";
        }
      } catch (error) {
        console.error(error);
        button.disabled = false;
        status.textContent =
          "Ошибка запуска. Подробности в консоли браузера.";
      }
    });
  </script>
</body>
</html>
